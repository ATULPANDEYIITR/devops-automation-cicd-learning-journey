# File: pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-admin-automation"
version = "1.0.0"
description = "A Python toolkit for repeatable Linux system administration automation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Linux Administration Automation Project" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0"
]

[project.scripts]
linux-admin = "linux_admin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: tests requiring a Linux host or system services"
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
branch = true
source = ["linux_admin"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:"
]
